; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino
description = Ink Screen Calendar
build_type = release
upload_speed = 921600
monitor_speed = 115200
board_upload.before_reset = default_reset
board_upload.after_reset  = hard_reset
board_build.partitions = min_spiffs.csv
lib_deps = 
	olikraus/U8g2_for_Adafruit_GFX@^1.8.0
	bblanchon/ArduinoJson@^7.2.0
	tzapu/WiFiManager@^2.0.17
	mathertel/OneButton@^2.6.1
	https://github.com/JADE-Jerry/nongli.git
	https://github.com/tignioj/ArduinoUZlib
	https://github.com/Wh1teRabbitHU/RX8010SJ
build_flags =
    -D SI_DRIVER=98
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
